services:
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ./api:/app
      - api_node_modules:/app/node_modules
    environment:
      - DATABASE_URL=postgresql://eventhub:eventhub@db:5432/eventhub
    depends_on:
      - db

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules
    depends_on:
      - api

  db:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=eventhub
      - POSTGRES_PASSWORD=eventhub
      - POSTGRES_DB=eventhub
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  api_node_modules:
  web_node_modules:
  pgdata:
